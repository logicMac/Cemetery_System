<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="930" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="760" height="930" fill="white"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">System Flowchart - Matinao Memorial Cemetery Mapping System</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- START -->
  <ellipse cx="350" cy="70" rx="50" ry="25" fill="#90EE90" stroke="black" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-family="Arial" font-size="14">START</text>

  <!-- Arrow down -->
  <line x1="350" y1="95" x2="350" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- User Login -->
  <rect x="250" y="120" width="200" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" font-family="Arial" font-size="14">User Login (Admin/Visitor)</text>

  <!-- Arrow down -->
  <line x1="350" y1="170" x2="350" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision: Credentials Valid? -->
  <polygon points="350,190 455,235 350,280 245,235" fill="#FFD700" stroke="black" stroke-width="2"/>
  <text x="350" y="230" text-anchor="middle" font-family="Arial" font-size="12">Credentials</text>
  <text x="350" y="245" text-anchor="middle" font-family="Arial" font-size="12">Valid?</text>

  <!-- No: loop back to login (left side) -->
  <line x1="245" y1="235" x2="60" y2="235" stroke="black" stroke-width="2"/>
  <line x1="60" y1="235" x2="60" y2="145" stroke="black" stroke-width="2"/>
  <line x1="60" y1="145" x2="250" y2="145" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="225" text-anchor="middle" font-family="Arial" font-size="11">No</text>

  <!-- Yes: down to role decision -->
  <line x1="350" y1="280" x2="350" y2="300" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="295" text-anchor="middle" font-family="Arial" font-size="11">Yes</text>

  <!-- Decision: Admin or Visitor -->
  <polygon points="350,300 470,355 350,410 230,355" fill="#FFD700" stroke="black" stroke-width="2"/>
  <text x="350" y="350" text-anchor="middle" font-family="Arial" font-size="12">Admin or</text>
  <text x="350" y="365" text-anchor="middle" font-family="Arial" font-size="12">Visitor?</text>

  <!-- Arrow left (Admin) -->
  <line x1="230" y1="355" x2="170" y2="355" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="345" text-anchor="middle" font-family="Arial" font-size="11">Admin</text>

  <!-- Admin Dashboard -->
  <rect x="70" y="330" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="120" y="360" text-anchor="middle" font-family="Arial" font-size="12">Admin Dashboard</text>

  <!-- Arrow down -->
  <line x1="120" y1="380" x2="120" y2="430" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Add/Edit Records -->
  <rect x="70" y="430" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="120" y="460" text-anchor="middle" font-family="Arial" font-size="12">Add/Edit Records</text>

  <!-- Arrow down -->
  <line x1="120" y1="480" x2="120" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Manage Plots -->
  <rect x="70" y="530" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="120" y="560" text-anchor="middle" font-family="Arial" font-size="12">Manage Plots</text>

  <!-- Arrow right to GPS Navigation -->
  <line x1="170" y1="555" x2="300" y2="555" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow right (Visitor) -->
  <line x1="470" y1="355" x2="570" y2="355" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="345" text-anchor="middle" font-family="Arial" font-size="11">Visitor</text>

  <!-- Visitor Dashboard -->
  <rect x="570" y="330" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="620" y="360" text-anchor="middle" font-family="Arial" font-size="12">Visitor Dashboard</text>

  <!-- Arrow down -->
  <line x1="620" y1="380" x2="620" y2="430" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Search Records -->
  <rect x="570" y="430" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="620" y="460" text-anchor="middle" font-family="Arial" font-size="12">Search Records</text>

  <!-- Arrow down -->
  <line x1="620" y1="480" x2="620" y2="530" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- View Map -->
  <rect x="570" y="530" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="620" y="560" text-anchor="middle" font-family="Arial" font-size="12">View Map</text>

  <!-- Arrow left to GPS Navigation -->
  <line x1="570" y1="555" x2="400" y2="555" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- GPS Navigation -->
  <rect x="300" y="530" width="100" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="350" y="560" text-anchor="middle" font-family="Arial" font-size="12">GPS Navigation</text>

  <!-- Arrow down to Need Help? -->
  <line x1="350" y1="580" x2="350" y2="610" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision: Need Help? -->
  <polygon points="350,610 460,675 350,740 240,675" fill="#FFD700" stroke="black" stroke-width="2"/>
  <text x="350" y="670" text-anchor="middle" font-family="Arial" font-size="12">Need Help?</text>
  <text x="350" y="685" text-anchor="middle" font-family="Arial" font-size="12">(Yes/No)</text>

  <!-- Yes: right to AI Assistant Query -->
  <line x1="460" y1="675" x2="500" y2="675" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="665" text-anchor="middle" font-family="Arial" font-size="11">Yes</text>

  <!-- AI Assistant Query -->
  <rect x="500" y="650" width="160" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="580" y="680" text-anchor="middle" font-family="Arial" font-size="12">AI Assistant Query</text>

  <!-- Arrow down -->
  <line x1="580" y1="700" x2="580" y2="725" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Get AI Response -->
  <rect x="500" y="725" width="160" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="580" y="755" text-anchor="middle" font-family="Arial" font-size="12">Get AI Response</text>

  <!-- Loop back: re-ask Need Help? (merge before the decision) -->
  <line x1="660" y1="750" x2="720" y2="750" stroke="black" stroke-width="2"/>
  <line x1="720" y1="750" x2="720" y2="595" stroke="black" stroke-width="2"/>
  <line x1="720" y1="595" x2="350" y2="595" stroke="black" stroke-width="2"/>

  <!-- No: down to Logout -->
  <line x1="350" y1="740" x2="350" y2="765" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="755" text-anchor="middle" font-family="Arial" font-size="11">No</text>

  <!-- Logout -->
  <rect x="285" y="765" width="130" height="50" fill="#87CEEB" stroke="black" stroke-width="2"/>
  <text x="350" y="795" text-anchor="middle" font-family="Arial" font-size="14">Logout</text>

  <!-- Arrow down -->
  <line x1="350" y1="815" x2="350" y2="845" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- STOP -->
  <ellipse cx="350" cy="880" rx="50" ry="25" fill="#FF6B6B" stroke="black" stroke-width="2"/>
  <text x="350" y="885" text-anchor="middle" font-family="Arial" font-size="14">STOP</text>
</svg>
