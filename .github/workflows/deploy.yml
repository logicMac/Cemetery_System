name: Deploy to InfinityFree

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./cemetery_mapping
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.gitignore
            test_*.html
            test_*.php
            check_*.php
            setup_*.php
            setup_*.sql
            create_admin.php
