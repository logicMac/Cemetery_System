<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" style="background:#ffffff;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">UNDAS: Web-Based AI-Powered Cemetery</text>
  <text x="600" y="58" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">Mapping and Grave Locator System</text>

  <!-- Top: External Mapping &amp; AI Services -->
  <rect x="440" y="80" width="320" height="80" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="105" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">External Mapping &amp; AI Services</text>
  <text x="600" y="125" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">OSRM Routing • Groq API</text>
  <text x="600" y="143" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#333333">Google Satellite Tiles</text>

  <!-- Central System Process -->
  <rect x="460" y="240" width="280" height="240" rx="20" ry="20" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="600" y="345" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000">UNDAS</text>
  <text x="600" y="365" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#000000">Web-Based AI-Powered Cemetery</text>
  <text x="600" y="375" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="11" fill="#000000">Mapping and Grave Locator System</text>

  <!-- Left: Authorized Administrator -->
  <rect x="60" y="240" width="180" height="240" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="150" y="345" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Authorized</text>
  <text x="150" y="365" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Administrator</text>

  <!-- Right: Visitor / Public User -->
  <rect x="960" y="240" width="180" height="240" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1050" y="345" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Visitor /</text>
  <text x="1050" y="365" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Public User</text>

  <!-- Administrator to System -->
  <line x1="240" y1="270" x2="460" y2="270" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="350" y="260" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Login Credentials</text>

  <line x1="240" y1="300" x2="460" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="350" y="290" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Record / Plot / Grid Data</text>

  <line x1="240" y1="330" x2="460" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="350" y="320" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Reservation / Payment Actions</text>

  <!-- System to Administrator -->
  <line x1="460" y1="410" x2="240" y2="410" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="350" y="397" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Dashboard / Reports / Statistics</text>

  <line x1="460" y1="440" x2="240" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="350" y="427" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Alerts / Notifications</text>

  <!-- Visitor to System -->
  <line x1="960" y1="270" x2="740" y2="270" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="260" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Registration / Login</text>

  <line x1="960" y1="300" x2="740" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="290" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Search / Filter / Queries</text>

  <line x1="960" y1="330" x2="740" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="320" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Reservation Requests</text>

  <!-- System to Visitor -->
  <line x1="740" y1="410" x2="960" y2="410" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="397" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Map, Markers &amp; Polygons</text>

  <line x1="740" y1="440" x2="960" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="850" y="427" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Directions &amp; Assistant Replies</text>

  <!-- External to System -->
  <line x1="530" y1="160" x2="530" y2="240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="545" y="190" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Route Data / AI Responses</text>

  <!-- System to External -->
  <line x1="670" y1="240" x2="670" y2="160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="655" y="210" text-anchor="end" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="10" fill="#000000">Routing / AI Requests</text>
</svg>
